<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Graft</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/frame.css">
  <link rel="stylesheet" href="css/view.css">
  <link rel="stylesheet" href="css/dialogs.css">
  <link rel="stylesheet" href="css/graft.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="orbs" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span></div>

  <div id="titlebar" class="titlebar">
    <span class="titlebar-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6M18 10.2c0 4-6 3.5-11 6.8"/></svg></span>
    <span class="titlebar-title">Graft</span>
    <span id="titleRepo" class="titlebar-repo"></span>
  </div>

  <div class="shell">
    <nav id="sidebar" class="glass side" aria-label="Repository"></nav>
    <div id="sideResize" class="resizer resizer-v" title="Drag to resize"></div>
    <main class="work">
      <div id="toolbar" class="glass toolbar"></div>
      <div id="banner" class="glass state-banner" hidden></div>
      <div id="netbar" class="netbar" hidden></div>
      <div class="views">
        <section id="view-welcome" class="view" hidden></section>
        <section id="view-changes" class="view" hidden></section>
        <section id="view-history" class="view" hidden></section>
        <section id="view-settings" class="view view-scroll" hidden></section>
        <section id="view-blame" class="view" hidden></section>
      </div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/ui/appearance.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/ui/dialog.js"></script>
  <script src="js/repo.js"></script>
  <script src="js/diffparse.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/diffview.js"></script>
  <script src="js/ui/actions.js"></script>
  <script src="js/ui/sidebar.js"></script>
  <script src="js/ui/toolbar.js"></script>
  <script src="js/ui/welcome.js"></script>
  <script src="js/ui/changes.js"></script>
  <script src="js/ui/conflict.js"></script>
  <script src="js/ui/history.js"></script>
  <script src="js/ui/blame.js"></script>
  <script src="js/ui/rebase.js"></script>
  <script src="js/ui/palette.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
